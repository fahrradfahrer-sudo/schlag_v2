<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Field Management System</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="css/style.css">
    <style>
        #field-list-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        #field-list-table th, #field-list-table td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        #field-list-table th {
            background-color: #f2f2f2;
        }
        .total-area {
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .modal-body {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .bulk-actions {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">AgriField Manager</h1>
        <div class="header-right" style="display: flex; align-items: center; gap: 20px;">
            <div class="form-group" style="margin-bottom: 0; color: white;">
                <label id="label-year" style="display: inline; margin-right: 5px;">Management Year:</label>
                <select id="mgmt-year-select" onchange="changeYear(this.value)" style="width: auto; padding: 5px;"></select>
            </div>
            <div class="lang-switch" style="position: static;">
                <button onclick="setLanguage('en')">EN</button>
                <button onclick="setLanguage('de')">DE</button>
            </div>
        </div>
        <div id="user-info"><span id="farmer-overview-text">Farmer Overview</span></div>
    </header>
    <div id="container">
        <aside id="sidebar" style="width: 450px;">
            <div class="field-overview-header">
                <h3 id="field-overview-title">Field Overview</h3>
                <div class="btn-group">
                    <button class="btn-primary" id="zoom-all-btn" onclick="zoomToAllFields()">Zoom All</button>
                    <button class="btn-success" id="export-btn" onclick="exportISOXML()">Export ISOXML</button>
                    <div class="dropdown">
                        <button class="dropbtn" id="export-all-btn">Export All Fields</button>
                        <div class="dropdown-content">
                            <a href="#" onclick="exportAllData('xlsx')">Excel (.xlsx)</a>
                            <a href="#" onclick="exportAllData('csv')">CSV (.csv)</a>
                        </div>
                    </div>
                </div>
                <div class="total-area" id="total-area-display">Total Area: 0.00 ha</div>
            </div>

            <div class="bulk-actions">
                <h4 id="bulk-actions-title">Bulk Actions</h4>
                <div class="form-group">
                    <label id="label-select-crop">Select by Crop:</label>
                    <select id="bulk-select-crop" onchange="selectFieldsByCrop(this.value)">
                        <option value="" id="opt-all">-- All --</option>
                    </select>
                </div>
                <button class="btn-primary" id="btn-open-bulk-task" onclick="openBulkTaskModal()" style="width: 100%;">Apply Task to Selected</button>
            </div>

            <div class="import-section">
                <h3 id="import-title">Import Fields</h3>
                <input type="file" id="file-import" accept=".kml,.zip,.shp,.shx,.dbf,.prj,.xml" multiple style="display: none;">
                <input type="file" id="folder-import" webkitdirectory mozdirectory directory style="display: none;">
                <div style="display: flex; gap: 5px;">
                    <button class="btn-success" id="upload-btn" style="flex: 1;" onclick="document.getElementById('file-import').click()">Upload File</button>
                    <button class="btn-success" id="upload-folder-btn" style="flex: 1;" onclick="document.getElementById('folder-import').click()">Upload Folder</button>
                </div>
            </div>

            <div id="field-list-container">
                <h3 id="my-fields-title">My Fields</h3>
                <div style="overflow-x: auto;">
                    <table id="field-list-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="select-all-fields" onclick="toggleAllFields(this.checked)"></th>
                                <th id="th-name">Name</th>
                                <th id="th-crop">Crop</th>
                                <th id="th-area">ha</th>
                                <th id="th-last-task">Last Task</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="field-list"></tbody>
                    </table>
                </div>
            </div>
        </aside>
        <main id="map"></main>
    </div>

    <!-- Modals -->
    <div id="bulk-task-modal" class="modal">
        <div class="modal-content" style="width: 90%; max-width: 1100px; max-height: 90vh; margin: 2% auto; overflow: hidden; display: flex; flex-direction: column;">
            <h3 id="bulk-modal-title" style="margin-top: 0;">Create New Tasks</h3>
            <div class="modal-body" style="display: flex; gap: 20px; flex: 1; overflow-y: auto; min-height: 0;">
                <!-- Left: Field Selection -->
                <div style="flex: 1; border-right: 1px solid #ddd; padding-right: 20px;">
                    <h4 id="bulk-select-fields-title">Select Fields</h4>
                    <div class="form-group">
                        <input type="text" id="bulk-field-search" placeholder="Search by name, crop..." oninput="filterBulkFields()">
                    </div>
                    <div style="max-height: 400px; overflow-y: auto;">
                        <table id="bulk-field-selection-table" style="width: 100%; font-size: 0.9em;">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="bulk-select-all" onclick="toggleBulkSelection(this.checked)"></th>
                                    <th id="th-bulk-name">Name</th>
                                    <th id="th-bulk-crop">Crop</th>
                                    <th id="th-bulk-area">ha</th>
                                    <th id="th-bulk-last-task">Last Task</th>
                                </tr>
                            </thead>
                            <tbody id="bulk-field-list"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Right: Task Details -->
                <div style="flex: 1;">
                    <h4 id="bulk-task-details-title">Task Details</h4>
                    <div class="form-group">
                        <label id="label-bulk-task-type">Task Type:</label>
                        <select id="bulk-task-type" onchange="toggleBulkExtraFields()">
                            <option value="seeding" id="opt-seeding">Seeding</option>
                            <option value="fertilizing" id="opt-fertilizing">Fertilizing</option>
                            <option value="spraying" id="opt-spraying">Plant Protection</option>
                            <option value="tilling" id="opt-tilling">Tilling</option>
                            <option value="harvesting" id="opt-harvesting">Harvesting</option>
                        </select>
                    </div>

                    <!-- Plant Protection Extra -->
                    <div id="bulk-spraying-fields" style="display: none; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #fff;">
                        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                            <input type="text" id="bulk-psm-search" list="bulk-psm-list" placeholder="Search product..." style="flex: 1;" oninput="searchBulkPSM()">
                            <datalist id="bulk-psm-list"></datalist>
                        </div>

                        <div id="bulk-psm-api-selection" style="display: none; background: #f0f0f0; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                            <div class="form-group">
                                <label id="label-bulk-psm-awg">Application (AWG):</label>
                                <select id="bulk-psm-awg-select" onchange="onBulkAWGSelected()" style="width: 100%;"></select>
                            </div>
                            <div class="form-group">
                                <label id="label-bulk-psm-rate">Rate (Aufwandmenge):</label>
                                <input type="text" id="bulk-psm-rate-input" list="bulk-psm-rate-list" style="width: 100%;">
                                <datalist id="bulk-psm-rate-list"></datalist>
                            </div>
                            <button type="button" class="btn-success" onclick="addBulkProductToList()">Add Product</button>
                        </div>

                        <div id="bulk-added-products-container" style="display: none; margin-bottom: 10px;">
                            <h4 id="title-bulk-added-products">Added Products:</h4>
                            <ul id="bulk-added-products-list" style="padding-left: 20px;"></ul>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <div class="form-group" style="flex: 1;">
                                <label id="label-bulk-water-rate">Water Application Rate [l/ha]:</label>
                                <input type="number" id="bulk-task-water-rate" placeholder="e.g. 200">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label id="label-bulk-app-type">Application Type (Art der Verwendung):</label>
                                <select id="bulk-task-app-type" style="width: 100%;">
                                    <option value="Freiland" id="opt-bulk-app-freiland">Freiland</option>
                                    <option value="Gewächshaus" id="opt-bulk-app-gewaechshaus">Gewächshaus</option>
                                    <option value="Lager" id="opt-bulk-app-lager">Lager</option>
                                </select>
                            </div>
                        </div>

                        <div id="bulk-psm-details" style="background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 5px; display: none; font-size: 0.9em;">
                            <div id="bulk-psm-info-name"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="label-bulk-task-date">Date/Time:</label>
                        <input type="datetime-local" id="bulk-task-date">
                    </div>
                    <div class="form-group">
                        <label id="label-bulk-task-content">Details:</label>
                        <textarea id="bulk-task-content" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label id="label-bulk-task-comment">Comment:</label>
                        <textarea id="bulk-task-comment" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label id="label-bulk-task-employee">Employee:</label>
                        <input type="text" id="bulk-task-employee" value="Witt">
                    </div>
                    <div class="form-group">
                        <label id="label-bulk-treated-area">Treated Area [ha]:</label>
                        <input type="number" step="0.01" id="bulk-task-treated-area">
                    </div>
                    <div class="form-group" id="bulk-bbch-group" style="display: none;">
                        <label id="label-bulk-task-bbch">BBCH Stage:</label>
                        <input type="text" id="bulk-task-bbch" oninput="onBulkBBCHManualChange()">
                        <div style="margin-top: 5px;">
                            <label>BBCH Description:</label>
                            <input type="text" id="bulk-task-bbch-desc" placeholder="Stadium description...">
                        </div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn-primary" id="btn-bulk-apply" onclick="applyBulkTask()">Apply Task to Selected</button>
                <button id="btn-bulk-cancel" onclick="closeBulkModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="field-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Field Details</h3>
            <div class="modal-body">
                <input type="hidden" id="field-id">
                <div class="form-group">
                    <label id="label-name">Field Name:</label>
                    <input type="text" id="field-name">
                </div>
                <div class="form-group">
                    <label id="label-crop">Crop:</label>
                    <input type="text" id="field-crop" list="crop-list" placeholder="Search crop or EPPO code...">
                    <datalist id="crop-list"></datalist>
                </div>
                <div class="form-group">
                    <label id="label-seeding">Seeding Details:</label>
                    <textarea id="field-seeding" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label id="label-fertilizing">Fertilizing Details:</label>
                    <textarea id="field-fertilizing" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label id="label-spraying">Spraying Details:</label>
                    <textarea id="field-spraying" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label id="label-tilling">Tilling Details:</label>
                    <textarea id="field-tilling" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label id="label-harvesting">Harvesting Details:</label>
                    <textarea id="field-harvesting" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>General Notes:</label>
                    <textarea id="field-notes" rows="2"></textarea>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn-primary" id="save-field-btn">Save</button>
                <button id="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- proj4 for Shapefile reprojection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <!-- togeojson for KML -->
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <!-- shpjs for Shapefiles -->
    <script src="https://unpkg.com/shpjs@4.0.4/dist/shp.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
